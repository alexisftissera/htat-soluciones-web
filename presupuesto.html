<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedir presupuesto · HTAT Soluciones | Córdoba Capital</title>
<meta name="description" content="Pedí tu presupuesto de aires acondicionados o termotanques solares. Elegí el servicio y se abre WhatsApp con el mensaje listo. Presupuesto sin cargo.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://htat-cordoba.netlify.app/presupuesto">
<meta property="og:url" content="https://htat-cordoba.netlify.app/presupuesto">
<meta property="og:title" content="Pedir presupuesto · HTAT Soluciones | Córdoba Capital">
<meta property="og:description" content="Pedí tu presupuesto de aires acondicionados o termotanques solares. Presupuesto sin cargo en Córdoba Capital.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230D2B45'/><text x='50' y='68' font-size='44' font-weight='800' font-family='Arial' fill='%23F08C28' text-anchor='middle'>HT</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#E6EEF6;background:#0A1F33;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;background-image:radial-gradient(ellipse 95% 60% at 50% -5%,#17456A 0%,#0A1F33 60%)}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 24px}
.pp-top{padding:20px 0}
.pp-top-in{display:flex;align-items:center;justify-content:space-between}
.logo{text-decoration:none;color:#fff;font-weight:800;font-size:1.2rem}
.logo b{color:#F08C28}
.logo span{display:block;font-size:.68rem;font-weight:600;letter-spacing:1.5px;color:#B7CADA;text-transform:uppercase}
.pp-back{color:#B7CADA;text-decoration:none;font-weight:700;font-size:.9rem}
.pp-back:hover{color:#fff}
.pp-main{padding:26px 0 70px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#F08C28;font-size:.745rem;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;margin-bottom:16px}
.eyebrow i{width:6px;height:6px;background:#F08C28;border-radius:50%;display:block;box-shadow:0 0 0 4px rgba(240,140,40,.22)}
h1{color:#fff;font-size:1.9rem;line-height:1.2;margin-bottom:10px}
.lead{color:#B7CADA;margin-bottom:24px}
.pp-card{background:#fff;color:#0D2B45;border-radius:18px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.pp-grupo{margin:0 0 16px}
.pp-qlabel{display:block;font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4C5C6E;margin-bottom:8px}
.pp-qlabel em{font-style:normal;text-transform:none;letter-spacing:0;opacity:.65}
.pp-chips{display:flex;flex-wrap:wrap;gap:8px}
.pp-chip{position:relative}
.pp-chip input{position:absolute;opacity:0;pointer-events:none}
.pp-chip span{display:inline-block;border:1.5px solid rgba(13,43,69,.25);border-radius:999px;padding:10px 15px;font-weight:700;font-size:.86rem;cursor:pointer;color:#0D2B45}
.pp-chip input:checked+span{background:#0D2B45;border-color:#0D2B45;color:#fff}
.pp-chip input:focus-visible+span{outline:2px solid #F08C28;outline-offset:2px}
.pp-obs{width:100%;box-sizing:border-box;border:1.5px solid rgba(13,43,69,.25);border-radius:12px;padding:12px;font-size:.92rem;font-family:inherit;color:#0D2B45;margin-bottom:4px}
.pp-obs:focus{outline:none;border-color:#F08C28;box-shadow:0 0 0 4px rgba(240,140,40,.15)}
#ppOtraWrap{margin-top:10px}
.pp-err{margin:8px 0 0;color:#B42318;font-weight:700;font-size:.86rem}
.pp-err[hidden]{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 22px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;border:1.5px solid transparent;text-decoration:none;width:100%;margin-top:8px}
.btn-pri{background:#F08C28;color:#08203A}
.btn-pri:hover{background:#f59a3d}
.pp-note{margin:16px 0 0;font-size:.82rem;color:#B7CADA;text-align:center}
</style>
</head>
<body>
<header class="pp-top">
  <div class="wrap pp-top-in">
    <a href="index.html" class="logo"><b>HTAT</b><span>Soluciones</span></a>
    <a href="index.html" class="pp-back">← Volver</a>
  </div>
</header>
<main class="wrap pp-main">
  <div class="eyebrow"><i></i>Presupuesto sin cargo</div>
  <h1>Pedí tu presupuesto</h1>
  <p class="lead">Elegí el servicio, contanos dónde es y qué necesitás.</p>
  <div class="pp-card">
    <div class="pp-grupo">
      <span class="pp-qlabel">Servicio</span>
      <div class="pp-chips">
        <label class="pp-chip"><input type="radio" name="ppServicio" value="Aires acondicionados"><span>Aires acondicionados</span></label>
        <label class="pp-chip"><input type="radio" name="ppServicio" value="Termotanques solares"><span>Termotanques solares</span></label>
        <label class="pp-chip"><input type="radio" name="ppServicio" value="otra"><span>Otra</span></label>
      </div>
      <div id="ppOtraWrap" hidden>
        <input class="pp-obs" id="ppOtra" aria-label="¿Qué servicio necesitás?" />
      </div>
    </div>
    <div class="pp-grupo">
      <span class="pp-qlabel">Para</span>
      <div class="pp-chips">
        <label class="pp-chip"><input type="radio" name="ppDestino" value="hogar"><span>Hogar</span></label>
        <label class="pp-chip"><input type="radio" name="ppDestino" value="empresa"><span>Empresa</span></label>
        <label class="pp-chip"><input type="radio" name="ppDestino" value="negocio"><span>Negocio</span></label>
      </div>
    </div>
    <div class="pp-grupo">
      <span class="pp-qlabel">Tipo</span>
      <div class="pp-chips">
        <label class="pp-chip"><input type="radio" name="ppTipo" value="instalación"><span>Instalar</span></label>
        <label class="pp-chip"><input type="radio" name="ppTipo" value="mantenimiento"><span>Mantenimiento</span></label>
        <label class="pp-chip"><input type="radio" name="ppTipo" value="reparación"><span>Reparación</span></label>
      </div>
    </div>
    <div class="pp-grupo">
      <label class="pp-qlabel" for="ppObs">Observaciones <em>(opcional)</em></label>
      <input class="pp-obs" id="ppObs" />
    </div>
    <p class="pp-err" id="ppError" hidden></p>
    <button type="button" class="btn btn-pri" id="ppEnviar">Enviar por WhatsApp</button>
  </div>
  <p class="pp-note">Sin compromiso. Te orientamos según tu equipo y consumo.</p>
</main>
<script>
(function(){
var DEST={hogar:'el hogar',empresa:'una empresa',negocio:'un negocio'};
var env=document.getElementById('ppEnviar'),err=document.getElementById('ppError'),obs=document.getElementById('ppObs');
var otra=document.getElementById('ppOtra'),otraWrap=document.getElementById('ppOtraWrap');
function elegido(n){var s=document.querySelector('input[name="'+n+'"]:checked');return s?s.value:''}
document.querySelectorAll('input[name="ppServicio"]').forEach(function(r){
r.addEventListener('change',function(){
if(otraWrap)otraWrap.hidden=elegido('ppServicio')!=='otra';
});
});
if(env)env.addEventListener('click',function(){
var sRaw=elegido('ppServicio'),d=elegido('ppDestino'),t=elegido('ppTipo');
if(!sRaw||!d||!t){if(err){err.textContent='Elegí servicio, destino y tipo.';err.hidden=false}return}
var s=sRaw;
if(sRaw==='otra'){
s=otra?otra.value.trim():'';
if(!s){if(err){err.textContent='Escribí qué servicio necesitás.';err.hidden=false}return}
}
if(err)err.hidden=true;
var msg='Hola, quiero un presupuesto de '+s+' para '+(DEST[d]||d)+' ('+t+').';
var o=obs?obs.value.trim():'';
if(o)msg+=' Observación: '+o;
window.open('https://wa.me/5493512869817?text='+encodeURIComponent(msg),'_blank','noopener');
});
})();
</script>
</body>
</html>
